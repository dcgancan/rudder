packages:
  - "packages/*"
  - "apps/*"

# esbuild yalnızca drizzle-kit'in (migration üretme aracı) bağımlılığıdır.
# Çalışma zamanında bulunmaz; kurulum script'i platforma uygun ikiliyi bağlar.
#
# better-sqlite3 native bir modüldür; kurulum script'i platforma uygun hazır
# ikiliyi indirir, yoksa derler.
allowBuilds:
  esbuild: true
  better-sqlite3: true
  sharp: true
  # Next.js'in kendi bileşenleri: SWC derleyicisi ve dosya izleyici.
  '@parcel/watcher': true
  '@swc/core': true
